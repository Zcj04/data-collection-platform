# 数据采集平台 - 平台配置（优化版 v2）
# 各平台端点、限流、字段映射等非敏感配置

# SQLite 与 Fernet 密钥必须成对备份，避免数据库可恢复但凭证无法解密。
backup:
  enabled: true
  directory: "data/backups/automatic"
  interval_seconds: 3600
  retention_days: 30
  max_age_hours: 36
  health_cache_seconds: 60
  required_on_startup: true

# webhook 留空时故障仍会持久化，配置后仅允许 HTTPS 异步投递。
alerts:
  webhook_url: ""
  timeout_seconds: 5
  poll_interval_seconds: 30
  max_attempts: 5

auth:
  login_max_failures: 5
  login_window_seconds: 900
  login_block_seconds: 900

logging:
  file: "data/logs/app_fastapi.log"
  max_bytes: 10485760
  backup_count: 10

platforms:
  meituan:
    name: "美团"
    type: "async"
    base_url: "https://e.dianping.com"
    common_params: "yodaReady=h5&csecplatform=4&csecversion=4.2.0"
    download_base_url: "https://e.dianping.com/finance/ajax/downloadManagement"
    # 轮询策略：渐进式退避
    poll_initial_interval: 5       # 初始轮询间隔（秒）
    poll_max_interval: 30          # 最大轮询间隔（秒）
    poll_max_seconds: 2400         # 总轮询超时（40分钟，与 task_timeout 一致）
    poll_backoff_factor: 2.0       # 退避因子
    # 并行策略
    parallel_partners: true        # 多账号并行下载
    task_timeout: 2400             # 平台级采集任务超时（40分钟，覆盖全局默认600s；勿与 HTTP timeout 混用）
    metrics: ["美团收款", "美团实收", "美团手续费"]

  yuntai:
    name: "芸苔"
    type: "sync"
    base_url: "https://www.rapa.vip"
    timeout: 30
    metrics:
      - "芸苔现金"
      - "芸苔微信"
      - "芸苔支付宝"
      - "芸苔手续费"
      - "芸苔非团购"
      - "芸苔远程取币"
      - "芸苔投币"
      - "芸苔出货"
      - "芸苔出币"
      - "芸苔积分增加"
      - "芸苔积分减少"

  douyin:
    name: "抖音"
    type: "sync"
    base_url: "https://life.douyin.com"
    timeout: 60
    metrics: ["抖音收款", "抖音手续费"]

  leyaoyao:
    name: "乐摇摇"
    type: "sync"
    base_url: "https://b.leyaoyao.com"
    timeout: 30
    metrics: ["乐摇摇非现金", "乐摇摇现金", "乐摇摇手续费", "乐摇摇投币", "乐摇摇出货"]

  duojinbao:
    name: "多金宝"
    type: "sync"
    base_url: "https://djb.leyaoyao.com"
    timeout: 30
    metrics: ["多金宝现金", "多金宝非现金", "多金宝手续费", "多金宝投币", "多金宝出币", "多金宝出货"]

  jingjian:
    name: "鲸舰"
    type: "sync"
    base_url: "http://grabmono.jingjianx.vip"
    login_base_url: "http://21359-grabmono.jingjianx.vip"
    data_base_url: "http://grabmono.jingjianx.vip"
    timeout: 30
    metrics: ["鲸舰现金", "鲸舰微信", "鲸舰支付宝", "鲸舰Payme", "鲸舰非现金", "鲸舰出币", "鲸舰投币", "鲸舰出货", "鲸舰积分增加", "鲸舰积分减少"]

  starthing:
    name: "StarThing"
    type: "sync"
    base_url: "https://pro.starthing.com"
    timeout: 30
    metrics: ["StarThing总收款", "StarThing非现金", "StarThing现金", "StarThing出币", "StarThing收币", "StarThing积分增加", "StarThing积分减少", "StarThing机台投币", "StarThing出货"]

  new_system:
    name: "新系统"
    type: "sync"
    base_url: "https://env-00jxtojvu5lg.dev-hz.cloudbasefunction.cn"
    timeout: 60
    metrics: ["新系统积分增加", "新系统积分减少"]

  huilian:
    name: "汇联"
    type: "sync"
    base_url: "https://merchant.iotbox.cn"
    timeout: 30
    metrics: ["汇联总收入", "汇联手续费", "汇联现金", "汇联实收", "汇联非现金"]

  kpay:
    name: "KPay"
    type: "sync"
    base_url: "https://pc.kpay-group.com"
    timeout: 60
    metrics: ["Kpay收款", "Kpay手续费"]

  youcaihua:
    name: "油菜花"
    type: "sync"
    # 一个子域名 = 一个商场（86450002 为某省会城市商场编码）；多店时按账号扩展
    base_url: "http://86450002.v004.youcaihua.net:88"
    timeout: 30
    # 店内收银三种支付方式 + 盈客宝渠道；抖音团购/美团大众渠道与其他平台重复，不采集
    metrics: ["油菜花现金", "油菜花微信", "油菜花支付宝", "油菜花盈客宝"]

  octopus:
    name: "八达通"
    type: "local_csv"
    file_path: "E:\\八爪鱼项目配置数据\\日报\\资源文件夹\\八达通\\report.csv"
    metrics: ["八达通收款", "八达通手续费"]

  payment:
    name: "货款"
    type: "local_excel"
    # 平时使用日货款表；目标日期为当月最后一天时使用月货款表（file_path）
    file_path: "C:\\公司数据\\货款表\\月货款表\\门店货款数据.xlsx"
    file_path_daily: "C:\\公司数据\\货款表\\日货款表\\门店货款数据.xlsx"
    metrics: ["基础货款"]

  coin_exchange:
    name: "兑币机"
    type: "local_json"
    # 数据来源：金山文档在线表格（每天更新）
    source_url: "https://www.kdocs.cn/l/cl3QDSIivSfi"
    cell_range: "B40:B70"
    # 工作表名（留空用默认表；如 "8月A店现金表"）
    sheet: ""
    # online=只在线读取；file=只读八爪鱼导出文件；auto=先在线，失败回落文件
    fetch_mode: "auto"
    venue: "香港A店"
    # 八爪鱼导出的 JSON 文件路径（fetch_mode=file 或 auto 兜底时使用）
    data_file: "data/coin_exchange.json"
    metrics: ["兑币机收款"]

# 人工追查源数据时使用的网页入口白名单。
# 这里只允许无账号、无 token、无动态查询参数的 HTTPS 页面；不要填写爬虫 API。
platform_links:
  meituan: "https://e.dianping.com/"
  yuntai: "https://www.rapa.vip/appyunyoutenant/"
  douyin: "https://life.douyin.com/p/login"
  leyaoyao: "https://b.leyaoyao.com/merchant-saas/"
  duojinbao: "https://djb.leyaoyao.com/pages/smallground_b/index.html"
  starthing: "https://pro.starthing.com/"
  new_system: "https://env-00jxtojvu5lg-static.normal.cloudstatic.cn/admin/"
  huilian: "https://merchant.iotbox.cn/wap/"
  kpay: "https://pc.kpay-group.com/"
  coin_exchange: "https://www.kdocs.cn/l/cl3QDSIivSfi"

scheduler:
  max_workers: 12               # 线程池大小
  single_task_timeout: 600      # 单平台采集超时秒数（10分钟）
  max_retries: 3                # 最大重试次数
  process_isolation: true       # 正式采集在独立进程运行，超时可回收浏览器/网络子进程
  auto_collect:
    enabled: true               # 服务持续运行时自动采集；普通查看用户不触发采集
    check_interval_seconds: 30
    slots:
      # 先固化昨日正式数据（10:00），跑完再开始当日实时档——保证实时收入的减法基线是最终值
      - key: "yesterday-final"
        label: "昨日正式数据"
        at: "10:00"             # 采集目标月份1日至昨日，补齐并核对正式累计数据
        target_day_offset: 1
      # ---- 实时档：10:30-22:30 每小时采集当日累计（覆盖式更新今日快照）----
      # 今日实时收入 = 今日累计快照 - 昨日累计快照；daily_summary 按(平台,日期)先删后插，不会膨胀
      - { key: "intraday-1030", label: "当日实时 10:30", at: "10:30", target_day_offset: 0 }
      - { key: "intraday-1130", label: "当日实时 11:30", at: "11:30", target_day_offset: 0 }
      - { key: "intraday-1230", label: "当日实时 12:30", at: "12:30", target_day_offset: 0 }
      - { key: "intraday-1330", label: "当日实时 13:30", at: "13:30", target_day_offset: 0 }
      - { key: "intraday-1430", label: "当日实时 14:30", at: "14:30", target_day_offset: 0 }
      - { key: "intraday-1530", label: "当日实时 15:30", at: "15:30", target_day_offset: 0 }
      - { key: "intraday-1630", label: "当日实时 16:30", at: "16:30", target_day_offset: 0 }
      - { key: "intraday-1730", label: "当日实时 17:30", at: "17:30", target_day_offset: 0 }
      - { key: "intraday-1830", label: "当日实时 18:30", at: "18:30", target_day_offset: 0 }
      - { key: "intraday-1930", label: "当日实时 19:30", at: "19:30", target_day_offset: 0 }
      - { key: "intraday-2030", label: "当日实时 20:30", at: "20:30", target_day_offset: 0 }
      - { key: "intraday-2130", label: "当日实时 21:30", at: "21:30", target_day_offset: 0 }
      - { key: "intraday-2230", label: "当日实时 22:30", at: "22:30", target_day_offset: 0 }
  retention:                    # 数据保留策略：后台每日自动清理，防止长期运行占满磁盘
    task_days: 180              # tasks 任务记录保留天数
    run_days: 365               # scheduled_collection_runs 自动采集批次记录保留天数
    log_days: 30                # logs/*.log 日志文件保留天数
    daily_summary_days: 0       # daily_summary 经营数据保留天数；0=永久保留（月累计减法依赖当月+上月快照，不要设小）

# ===================== 连接池配置 =====================
mysql_pool:
  pool_size: 5                  # 连接池基础大小
  max_overflow: 3               # 额外溢出连接数
  connect_timeout: 10           # 连接超时
  read_timeout: 30              # 读取超时

# ===================== HTTP 客户端配置 =====================
http:
  connect_timeout: 10           # TCP 连接超时
  read_timeout: 30              # 读取响应超时
  max_retries: 2                # GET/HEAD/OPTIONS 最大自动重试次数
  retry_backoff: 0.5            # 重试退避系数（秒）
  pool_connections: 10          # 连接池连接数
  pool_maxsize: 20              # 连接池最大大小

# ===================== 缓存配置 =====================
cache:
  venue_map_ttl: 3600           # 场地映射缓存TTL（秒，默认1小时）

# MySQL 外部数据库（store_mapping_db）
mysql:
  host: "localhost"
  port: 3306
  user: "root"
  # 密码已迁移到 .env（MYSQL_PASSWORD），此处留空
  password: ""
  database: "store_mapping_db"
  charset: "utf8mb4"
  connect_timeout: 10
  read_timeout: 30
  write_timeout: 30

database:
  sqlite_path: "data/app.db"

credentials:
  encrypt_file: "credentials/credentials.enc"

# ===================== 月度目标（数据大屏） =====================
targets:
  # 月度目标表路径（相对项目根目录；「最终核定目标」列为门店目标）
  file: "data/targets/2026-08_区域门店目标汇总表.xlsx"
  # 门店 → 区域 归属映射（区域完成度用；格式 JSON：{"门店名": "区域名"}）
  store_regions_file: "data/targets/regions.json"

# ===================== AI 分析师（core/analyst）=====================
analyst:
  provider: "deepseek"              # deepseek / openai / qwen / ollama（均为 OpenAI 兼容接口）
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-flash"
  temperature: 0.3
  max_tool_rounds: 6                # 单轮问答最多工具调用轮次
  timeout: 90                       # 单次模型请求超时（秒）
